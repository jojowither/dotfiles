# ~/.config/starship.toml — 仿 Powerlevel10k rainbow：兩行、外框、左右兩側都是色塊
#
#   ╭─ 系統/主機 │ 目錄 │ git │ 語言/環境 ▶ ──────────── ◀ 錯誤碼 ◀ 耗時 ◀ 背景工作 ◀ 時間 ─╮
#   ╰─ ❯                                                                                    ─╯
#
# 右側色塊只在需要時出現：錯誤碼（指令失敗）、耗時（超過 2 秒）、背景工作（有 Ctrl-Z / & 的 job）。
#
# - 需要 Nerd Font（Brewfile 已裝 MesloLGS / JetBrainsMono Nerd Font），終端機字型要選它，否則圖示會變方塊。
# - 顏色用 Catppuccin Mocha，和 config/ghostty/config 的主題一致；想換色只要改最下面的 palette。
# - 圖示用 \uXXXX 跳脫寫法（TOML 雙引號字串），避免複製貼上時字元跑掉。
# - 想回到簡潔版：starship preset no-nerd-font -o ~/.config/starship.toml，或看 git 歷史的舊版。
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'catppuccin_mocha'

format = """
[╭─](fg:surface1)[](fg:surface1)\
$os$username$hostname\
[](fg:surface1 bg:blue)\
$directory\
[](fg:blue bg:green)\
$git_branch$git_status$git_state\
[](fg:green bg:teal)\
$python$nodejs$golang$rust$java$docker_context$kubernetes\
[](fg:teal) \
$fill\
 $status$cmd_duration$jobs$time\
[─╮](fg:surface1)
[╰─](fg:surface1)$character"""

# 右邊框的下半段（right_format 只作用在最後一行）
right_format = '[─╯](fg:surface1)'

# ---------- 第一段：系統圖示（SSH 時加上 user@host）----------
[os]
disabled = false
style = 'bg:surface1 fg:text'
format = '[ $symbol ]($style)'

[os.symbols]
Macos = ""
Ubuntu = ""
Debian = ""
Arch = ""
Fedora = ""
Raspbian = ""
Linux = ""
Windows = ""

[username]
show_always = false          # 只有 root 或 SSH 時顯示
style_user = 'bg:surface1 fg:yellow'
style_root = 'bg:surface1 fg:red bold'
format = '[$user]($style)'

[hostname]
ssh_only = true              # 連到 server 時才顯示主機名，一眼分辨在哪台
ssh_symbol = ''
style = 'bg:surface1 fg:yellow'
format = '[@$hostname ]($style)'

# ---------- 第二段：目錄 ----------
[directory]
style = 'bg:blue fg:crust bold'
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = "\U000F033E "
read_only_style = 'bg:blue fg:red'
truncation_length = 4
truncate_to_repo = false
truncation_symbol = '…/'

[directory.substitutions]
"Documents" = "\U000F0219"
"Downloads" = ""
"Projects" = ""

# ---------- 第三段：git ----------
[git_branch]
symbol = ""
style = 'bg:green fg:crust'
format = '[ $symbol $branch ]($style)'

[git_status]
style = 'bg:green fg:crust'
format = '[($all_status$ahead_behind )]($style)'

[git_state]
style = 'bg:green fg:crust bold'
format = '[\($state( $progress_current/$progress_total)\) ]($style)'

# ---------- 第四段：語言 / 環境（偵測到才出現）----------
[python]
symbol = ""
style = 'bg:teal fg:crust'
format = '[ $symbol( $version)( \($virtualenv\)) ]($style)'

[nodejs]
symbol = ""
style = 'bg:teal fg:crust'
format = '[ $symbol( $version) ]($style)'

[golang]
symbol = ""
style = 'bg:teal fg:crust'
format = '[ $symbol( $version) ]($style)'

[rust]
symbol = ""
style = 'bg:teal fg:crust'
format = '[ $symbol( $version) ]($style)'

[java]
symbol = ""
style = 'bg:teal fg:crust'
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = 'bg:teal fg:crust'
format = '[ $symbol( $context) ]($style)'

[kubernetes]
disabled = false
symbol = "\U000F10FE"
style = 'bg:teal fg:crust'
format = '[ $symbol $context( \($namespace\)) ]($style)'

# ---------- 右側：耗時、錯誤碼、時間 ----------
[fill]
symbol = '─'
style = 'fg:surface1'

[status]
disabled = false             # 指令失敗時顯示 exit code，像 p10k
style = 'bg:red fg:crust bold'
symbol = '✘'
format = "[](fg:red)[ $symbol $status ]($style)"

[cmd_duration]
min_time = 2000
style = 'bg:yellow fg:crust'
format = "[](fg:yellow)[ $duration  ]($style)"

[jobs]
symbol = ""
number_threshold = 1
style = 'bg:peach fg:crust'
format = "[](fg:peach)[ $number $symbol ]($style)"

[time]
disabled = false
style = 'bg:surface1 fg:text'
time_format = '%H:%M:%S'
format = "[](fg:surface1)[ $time  ]($style)"

# ---------- 第二行 ----------
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'

[palettes.catppuccin_mocha]
text = '#cdd6f4'
overlay1 = '#7f849c'
surface1 = '#45475a'
crust = '#11111b'
blue = '#89b4fa'
green = '#a6e3a1'
teal = '#94e2d5'
yellow = '#f9e2af'
peach = '#fab387'
red = '#f38ba8'
